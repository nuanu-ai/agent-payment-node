[package]
name = "apn-keychain-agent"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "apn_keychain_agent"
path = "native/src/lib.rs"

[[bin]]
name = "APNKeychainAgent"
path = "native/src/main.rs"

[[test]]
name = "native_contract"
path = "tests/native/contract.rs"

[features]
default = []
acceptance-test = []

[dependencies]
libc = "=0.2.183"
secp256k1 = { version = "=0.31.1", features = ["recovery"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = { version = "=2.17.0", features = ["OSX_10_15"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
