name: Bug or installation problem
description: Report a reproducible APN issue without secrets or payment authorization.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, use SECURITY.md and GitHub private vulnerability reporting.
        Remove credentials, private keys, recovery material, approval codes, payment headers and raw provider authentication output.
  - type: input
    id: version
    attributes:
      label: APN version or source commit
      description: Paste the output of apn --version, or the source commit.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and installation method
      description: macOS version, Apple Silicon, Node.js version and Homebrew or source checkout. APN supports Apple Silicon macOS only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The command, the redacted output and what you expected.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error and operation state
      description: If relevant, state whether the outcome is unresolved. Do not send another payment to reproduce it.
