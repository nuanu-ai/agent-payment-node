name: Core tests

# The whole core suite and the other release preparation gates run here, on GitHub's macOS
# runners, instead of on a developer machine. The tests and gates check the pull request's merge
# commit. `dist` builds the branch head and publishes the TypeScript build of `dist/` and the
# regenerated vendor bundles to commit (the supply-chain job refuses a tracked `dist/` that
# differs from its build, and gates 3 to 6 refuse vendor bundles that differ from theirs).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's run; every commit on main keeps its complete run.
concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dist:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # The branch head itself, not the pull request's merge commit: its dist is the copy to commit.
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use the pinned release Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install the exact dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build dist from source
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- dist | xargs -0 rm
          npm run build:ts
          git status --short -- dist

      - name: Upload the built dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Regenerate the four SDK vendor bundles
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/vendor"
          mkdir "$out"
          node scripts/build-sdk-vendor.mjs --out-dir "$out/metamask-evm-sdk"
          node scripts/build-sdk-vendor.mjs --smart-account --out-dir "$out/metamask-smart-account"
          node scripts/build-sdk-vendor.mjs --tron-utils --out-dir "$out/tron-utils"
          node scripts/build-sdk-vendor.mjs --relay-order-id --out-dir "$out/relay-order-id"

      - name: Upload the regenerated vendor bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/vendor
          if-no-files-found: error
          retention-days: 7

  core:
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the pinned release Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install the exact dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build the test tree
        shell: bash
        run: |
          set -euo pipefail
          npm run build:ts
          NODE_OPTIONS=--max-old-space-size=4096 npm run build:test

      - name: Run shard ${{ matrix.shard }} of 8
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          APN_CORE_TEST_CONCURRENCY: "4"
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(ls dist-test/tests/core/*.test.js | sort | awk -v s="$SHARD" '(NR - 1) % 8 == s')
          echo "shard $SHARD: ${#files[@]} files"
          node scripts/run-core-tests.mjs "${files[@]}"

  packaging:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the pinned release Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install the exact dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Packaging tests and forbidden-surface check (the tail of test:core)
        shell: bash
        run: |
          set -euo pipefail
          npm run build:ts
          node --test tests/packaging/audit-production.test.mjs tests/packaging/installed-runtime-errors.test.mjs \
            tests/packaging/runtime-dependency-boundary.test.mjs tests/packaging/runtime-reviewed-versions.test.mjs \
            tests/packaging/runtime-metamask-sdk-vendor.test.mjs tests/packaging/runtime-tron-utils-vendor.test.mjs \
            tests/packaging/runtime-relay-order-id-vendor.test.mjs tests/packaging/runtime-smart-account-vendor.test.mjs
          node scripts/core-forbidden-surface.mjs
          # Exact dependency pins and overrides; outside test:core, but a dependency update must keep them true.
          node --test tests/packaging/x402-dependency.test.mjs tests/packaging/uuid-dependency.test.mjs

  # Gates 2 to 8 of the local release preparation (docs/local-release.md), on a runner.
  release-gates:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the pinned release Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install the exact dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Supply-chain and platform tests (gate 2)
        run: node --test tests/packaging/supply-chain.test.mjs tests/packaging/platform-support.test.mjs

      - name: Exact vendor regeneration (gates 3 to 6)
        shell: bash
        run: |
          set -euo pipefail
          npm run build:metamask-sdk:check
          npm run build:tron-utils:check
          npm run build:relay-order-id:check
          npm run build:smart-account:check

      - name: Production and vendor-emitted audits (gates 7 and 8)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-production.mjs
          node scripts/audit-vendor-emitted.mjs
