name: Lock refresh

# Resolves the lockfile of the dispatched branch on a runner, so a dependency update never
# runs npm on a developer machine. npm prefers npm-shrinkwrap.json when both files exist; the
# artifact holds the resolved shrinkwrap and its identical package-lock.json copy to commit.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the pinned release Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Resolve the lockfile without installing packages or running scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cp npm-shrinkwrap.json package-lock.json
          out="$RUNNER_TEMP/lock"
          mkdir "$out"
          cp npm-shrinkwrap.json package-lock.json "$out/"
          git diff --stat -- npm-shrinkwrap.json

      - name: Upload the resolved lockfiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lock-${{ github.sha }}
          path: ${{ runner.temp }}/lock
          if-no-files-found: error
          retention-days: 7
